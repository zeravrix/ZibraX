name: Build & Release ZIBRA (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - name: Setup Node.js & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build frontend & run JS tests
        run: |
          npm ci --ignore-scripts
          node --test src/lib/utils/readerNav.test.js
          npm run build
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p zibra-desktop
      - name: Package Linux archive
        run: |
          mkdir -p dist-linux/zibra-linux-x86_64
          cp target/release/zibra-desktop dist-linux/zibra-linux-x86_64/
          if [ -d assets ]; then cp -r assets dist-linux/zibra-linux-x86_64/; fi
          cp distribution/linux/zibra.desktop dist-linux/zibra-linux-x86_64/
          cp LICENSE README.md dist-linux/zibra-linux-x86_64/
          tar -czvf ZibraX-v2.2.2-Linux-x86_64.tar.gz -C dist-linux zibra-linux-x86_64
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZibraX-Linux-x86_64
          path: ZibraX-v2.2.2-Linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build frontend & run JS tests
        run: |
          npm ci --ignore-scripts
          node --test src/lib/utils/readerNav.test.js
          npm run build
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p zibra-desktop
      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          # 1. Portable ZIP
          New-Item -ItemType Directory -Force -Path dist-win/ZibraX-v2.2.2-PC-Portable
          Copy-Item target/release/zibra-desktop.exe dist-win/ZibraX-v2.2.2-PC-Portable/zibra-desktop.exe
          Copy-Item target/release/zibra-desktop.exe dist-win/ZibraX-v2.2.2-PC-Portable/ZERAVRIX.exe
          if (Test-Path assets) { Copy-Item -Recurse assets dist-win/ZibraX-v2.2.2-PC-Portable/ }
          Copy-Item LICENSE, README.md dist-win/ZibraX-v2.2.2-PC-Portable/
          Compress-Archive -Path dist-win/ZibraX-v2.2.2-PC-Portable/* -DestinationPath ZibraX-v2.2.2-PC-Portable.zip -Force

          # 2. Inno Setup installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribution/windows/ZibraX.iss

          # 3. Store MSIX & MSIXUPLOAD layout
          New-Item -ItemType Directory -Force -Path msix-layout/Assets
          Copy-Item target/release/zibra-desktop.exe msix-layout/ZERAVRIX.exe
          Copy-Item distribution/windows/store/AppxManifest.xml msix-layout/AppxManifest.xml
          Copy-Item distribution/windows/store/Assets/* msix-layout/Assets/

          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Write-Host "Using MakeAppx: $makeappx"
          & $makeappx pack /d msix-layout /p ZERAVRIX-Store-2.2.2-x64.msix /nv

          Compress-Archive -Path ZERAVRIX-Store-2.2.2-x64.msix -DestinationPath ZERAVRIX-Store-2.2.2-x64.msixupload -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZibraX-Windows-Release
          path: |
            target/release/zibra-desktop.exe
            ZibraX-v2.2.2-PC-Portable.zip
            ZibraX-v2.2.2-PC-Setup.exe
            ZERAVRIX-Store-2.2.2-x64.msix
            ZERAVRIX-Store-2.2.2-x64.msixupload
